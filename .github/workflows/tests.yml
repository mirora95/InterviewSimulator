name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Browser client regressions
        run: node --test InterviewSimulator.Tests/interview.test.cjs
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: SignalR integration tests
        run: dotnet test InterviewSimulator.sln --configuration Release --artifacts-path "${{ runner.temp }}/interview-tests"
